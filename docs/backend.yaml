apiVersion: v1
kind: Secret
metadata:
  name: eauth-config
  namespace: efucloud
type: Opaque
stringData:
  config.yaml: |
    # 用于 OIDC 元数据、回调地址等外部访问地址生成
    serverAddress: "http://eauth-demo.efucloud.com"
    tokenPeriod: 16
    uploadPath: "/efucloud/uploads"
    loginConfig:
      faceRecognition: true
      mfa: false
    mysql:
      host: "mysql:3306"
      user: "root"
      password: "EfuCloudPSD"
      dbname: "eauth"
      charset: "utf8mb4"
      loc: "Asia/Shanghai"
      defaultStringSize: 0
      disableDatetimePrecision: false
      dontSupportRenameColumn: false
      dontSupportRenameIndex: false
      skipInitializeWithVersion: false
    email:
      smtpServer: "smtp.qq.com"
      smtpPort: 465
      username: "noreply@example.com"
      password: "CHANGE_ME"
    logConfig:
      production: true
      filename: ""
      maxsize: 100
      maxbackups: 7
      maxage: 30
      compress: true
      localtime: true
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: eauth
  namespace: efucloud
  labels:
    app: eauth
spec:
  replicas: 1
  selector:
    matchLabels:
      app: eauth
  template:
    metadata:
      labels:
        app: eauth
    spec:
      containers:
        - name: eauth
          image: registry.cn-shenzhen.aliyuncs.com/efucloud-public/eauth:v1.0.0.202603231923
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 9001
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /api/health
              port: 9001
            initialDelaySeconds: 8
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /api/health
              port: 9001
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 5
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          volumeMounts:
            - name: config
              mountPath: /efucloud/config/config.yaml
              subPath: config.yaml
            - name: uploads
              mountPath: /efucloud/uploads
          env:
            - name: TZ
              value: Asia/Shanghai
      volumes:
        - name: config
          secret:
            secretName: eauth-config
        - name: uploads
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: eauth
  namespace: efucloud
  labels:
    app: eauth
spec:
  type: ClusterIP
  selector:
    app: eauth
  ports:
    - name: http
      port: 80
      targetPort: 9001
      protocol: TCP
---
# Optional ingress for the unified EAuth service.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: eauth
  namespace: efucloud
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: 2000m
spec:
  ingressClassName: nginx
  rules:
    - host: eauth-demo.efucloud.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: eauth
                port:
                  number: 80
  # tls:
  #   - hosts:
  #       - eauth-demo.efucloud.com
  #     secretName: eauth-tls
---
# Compatibility ingress for clients or UI links that still access
# /.well-known/openid-configuration at the root path.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: eauth-oidc-discovery
  namespace: efucloud
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /api/.well-known/openid-configuration
spec:
  ingressClassName: nginx
  rules:
    - host: eauth-demo.efucloud.com
      http:
        paths:
          - path: /.well-known/openid-configuration
            pathType: Exact
            backend:
              service:
                name: eauth
                port:
                  number: 80
